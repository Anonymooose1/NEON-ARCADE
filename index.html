
<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEON ARCADE</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0; background: #090919; color: white;
  font-family: Arial, sans-serif; text-align: center;
}
h1 { color: #45f3ff; text-shadow: 0 0 18px #00d9ff; }
p { color: #c9c9e8; }
#game {
  display: block; width: 100%; max-width: 420px;
  margin: 15px auto; background: #11112b;
  border: 2px solid #45f3ff; border-radius: 12px;
  touch-action: none;
}
button {
  background: #171733; color: #45f3ff;
  border: 2px solid #45f3ff; border-radius: 12px;
  padding: 14px 23px; margin: 5px;
  font-size: 17px; font-weight: bold;
}
button:active { background: #303060; }
#score { color: #ff72ec; font-size: 22px; }
</style>
</head>
<body>
<h1>⚡ NEON ARCADE ⚡</h1>
<p>DODGE THE BLOCKS</p>
<div id="score">Score: 0</div>

<canvas id="game" width="360" height="440"></canvas>

<button id="left">⬅ LEFT</button>
<button id="right">RIGHT ➡</button>
<br>
<button id="start">▶ START / RESTART</button>
<p>Move sideways. Don't hit the falling blocks!</p>

<script>
const c = document.getElementById("game");
const ctx = c.getContext("2d");
const scoreText = document.getElementById("score");
let player, blocks, score, running, last, spawn, keys;

function reset() {
  player = { x: 160, y: 385, w: 38, h: 30 };
  blocks = [];
  score = 0;
  spawn = 0;
  last = 0;
  keys = { left: false, right: false };
  running = true;
  scoreText.textContent = "Score: 0";
  requestAnimationFrame(loop);
}

function hold(id, direction) {
  const b = document.getElementById(id);
  b.addEventListener("pointerdown", e => {
    e.preventDefault();
    keys[direction] = true;
    b.setPointerCapture(e.pointerId);
  });
  function release() { keys[direction] = false; }
  b.addEventListener("pointerup", release);
  b.addEventListener("pointercancel", release);
  b.addEventListener("lostpointercapture", release);
}
hold("left", "left");
hold("right", "right");

document.addEventListener("keydown", e => {
  if (e.key === "ArrowLeft" || e.key === "a")
    keys.left = true;
  if (e.key === "ArrowRight" || e.key === "d")
    keys.right = true;
});
document.addEventListener("keyup", e => {
  if (e.key === "ArrowLeft" || e.key === "a")
    keys.left = false;
  if (e.key === "ArrowRight" || e.key === "d")
    keys.right = false;
});

function loop(time) {
  if (!running) return;
  const dt = Math.min((time - (last || time)) / 16.67, 2);
  last = time;
  ctx.clearRect(0, 0, 360, 440);

  ctx.strokeStyle = "#202050";
  for (let x = 0; x < 360; x += 30) {
    ctx.beginPath(); ctx.moveTo(x,0);
    ctx.lineTo(x,440); ctx.stroke();
  }

  if (keys.left) player.x -= 5 * dt;
  if (keys.right) player.x += 5 * dt;
  player.x = Math.max(0, Math.min(360-player.w, player.x));

  spawn += dt;
  if (spawn > Math.max(13, 35-score/5)) {
    blocks.push({
      x: Math.random()*326, y:-25, size:24,
      speed: 2.5 + Math.random()*1.8 + score/100
    });
    spawn = 0;
  }

  ctx.shadowBlur = 18;
  ctx.shadowColor = "#45f3ff";
  ctx.fillStyle = "#45f3ff";
  ctx.fillRect(player.x, player.y, player.w, player.h);

  for (let b of blocks) {
    b.y += b.speed * dt;
    ctx.shadowColor = "#ff3c78";
    ctx.fillStyle = "#ff3c78";
    ctx.fillRect(b.x, b.y, b.size, b.size);

    if (player.x < b.x+b.size &&
        player.x+player.w > b.x &&
        player.y < b.y+b.size &&
        player.y+player.h > b.y) {
      running = false;
    }
    if (!b.counted && b.y > 440) {
      score++;
      b.counted = true;
      scoreText.textContent = "Score: " + score;
    }
  }
  ctx.shadowBlur = 0;
  blocks = blocks.filter(b => b.y < 460);

  if (!running) {
    ctx.fillStyle = "rgba(5,5,20,.85)";
    ctx.fillRect(0,0,360,440);
    ctx.fillStyle = "#ff72ec";
    ctx.font = "bold 30px Arial";
    ctx.textAlign = "center";
    ctx.fillText("GAME OVER",180,205);
    ctx.fillStyle = "white";
    ctx.font = "18px Arial";
    ctx.fillText("Score: " + score,180,245);
    ctx.fillText("Tap RESTART to play again",180,280);
    return;
  }
  requestAnimationFrame(loop);
}

document.getElementById("start").onclick = reset;

ctx.fillStyle = "#45f3ff";
ctx.font = "20px Arial";
ctx.textAlign = "center";
ctx.fillText("TAP START TO PLAY",180,210);
</script>
</body>
</html>
